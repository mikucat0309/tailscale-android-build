name: Renovate

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  RENOVATE_REPORT_TYPE: file
  RENOVATE_REPORT_PATH: "/tmp/renovate-report.json"
  RENOVATE_REPOSITORIES: "${{ github.repository }}"
  RENOVATE_ONBOARDING: "false"
  RENOVATE_REQUIRE_CONFIG: "required"

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check new version
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ secrets.github_token }}
        env:
          RENOVATE_DRY_RUN: lookup

      - name: Find new version
        id: lookup
        run: |
          new_version=$(jq -r --arg dep "tailscale/tailscale-android" '
                  .. | objects
                  | select(.depName? == $dep)
                  | .updates[]?.newValue' "$RENOVATE_REPORT_PATH" | sort -uV | tail -1)
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          if [ -n "$new_version" ]; then
            echo "::notice::Update available: $new_version"
          fi

      - name: Checkout tailscale/tailscale-android
        if: steps.lookup.outputs.new_version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tailscale/tailscale-android
          ref: ${{ steps.lookup.outputs.new_version }}
          path: upstream

      - name: Setup Git
        if: steps.lookup.outputs.new_version != ''
        working-directory: upstream
        run: |
          git config --local user.name "Mikucat"
          git config --local user.email "git@mikucat.me"

      - name: Try to apply patches
        if: steps.lookup.outputs.new_version != ''
        working-directory: upstream
        run: git am ../patches/*.patch

      - name: Create pull request
        if: steps.lookup.outputs.new_version != ''
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ secrets.github_token }}
